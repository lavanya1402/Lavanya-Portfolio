        function formatDescription(description) {
            const parts = description.split('\n').map(part => part.trim()).filter(part => part.length > 0);
            let formattedDescription = `<div class="section-title">${parts[0]}</div>`;
            formattedDescription += `<p>${parts[1]}</p>`;
            formattedDescription += `<p>${parts.slice(2, 4).join(' ')}</p>`;

            formattedDescription += `<div class="section-title">${parts[4]}</div>`;
            const skills = parts.slice(5, 10).map(skill => skill.replace('-', '').trim()).filter(skill => skill.length > 0);
            formattedDescription += `<ul class="bullet-points">${skills.map(skill => `<li><strong>${skill}</strong></li>`).join('')}</ul>`;

            formattedDescription += `<div class="section-title">${parts[10]}</div>`;
            formattedDescription += `<p>${parts.slice(11).join(' ')}</p>`;

            return formattedDescription;
        }

        const params = getQueryParams();
        const projectId = params.project;

        function formatDescription(description) {
    const parts = description.split(/<\/?strong>/).filter(part => part.trim() !== '');
    let formattedDescription = '';

    if (parts.length > 0) {
        formattedDescription += `<div class="section-title">${parts[0]}</div>`;
    }

    if (parts.length > 1) {
        formattedDescription += `<p>${parts[1]}</p>`;
    }

    if (parts.length > 2) {
        formattedDescription += `<p>${parts[2]}</p>`;
    }

    if (parts.length > 3) {
        formattedDescription += `<div class="section-title">${parts[3]}</div>`;
    }

    if (parts.length > 4) {
        const skills = parts[4].split('<li>').map(skill => skill.replace(/<\/?ul>/g, '')).filter(skill => skill.length > 0);
        formattedDescription += `<ul class="bullet-points">${skills.map(skill => `<li><strong>${skill}</strong></li>`).join('')}</ul>`;
    }

    if (parts.length > 5) {
        formattedDescription += `<div class="section-title">${parts[5]}</div>`;
    }

    if (parts.length > 6) {
        formattedDescription += `<p>${parts.slice(6).join(' ')}</p>`;
    }
